<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<title>three.js WebGL · 关键帧动画</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js WebGL · 关键帧动画">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_animation_keyframes.html">

		<style>body {
	margin: 0;
	background-color: #000;
	color: #fff;
	font-family: Monospace;
	font-size: 13px;
	line-height: 24px;
	overscroll-behavior: none;
}

a {
	color: #ff0;
	text-decoration: none;
}

a:hover {
	text-decoration: underline;
}

button {
	cursor: pointer;
	text-transform: uppercase;
}

#info {
	position: absolute;
	top: 0px;
	width: 100%;
	padding: 10px;
	box-sizing: border-box;
	text-align: center;
	-moz-user-select: none;
	-webkit-user-select: none;
	-ms-user-select: none;
	user-select: none;
	pointer-events: none;
	z-index: 1; 
}

a, button, input, select {
	pointer-events: auto;
}

.lil-gui {
	z-index: 2 !important; 
}

@media all and ( max-width: 640px ) {
	.lil-gui.root { 
		right: auto;
		top: auto;
		max-height: 50%;
		max-width: 80%;
		bottom: 0;
		left: 0;
	}
}

#overlay {
	position: absolute;
	font-size: 16px;
	z-index: 2;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	display: flex;
	align-items: center;
	justify-content: center;
	flex-direction: column;
	background: rgba(0,0,0,0.7);
}

	#overlay button {
		background: transparent;
		border: 0;
		border: 1px solid rgb(255, 255, 255);
		border-radius: 4px;
		color: #ffffff;
		padding: 12px 18px;
		text-transform: uppercase;
		cursor: pointer;
	}

#notSupported {
	width: 50%;
	margin: auto;
	background-color: #f00;
	margin-top: 20px;
	padding: 10px;
}

a:focus-visible {outline:2px solid currentColor;outline-offset:4px;} canvas {display:block;}
@media(max-width:640px){#info{font-size:11px;line-height:20px;}#container>div:first-child{top:auto!important;bottom:0;}}
</style>
		<style>
			body {
				background-color: #e2e0e0;
				color: #000;
			}

			a {
				color: #2983ff;
			}
		</style>
	</head>

	<body>

		<div id="container" data-od-id="tokyo-scene"></div>

		<div id="info" data-od-id="model-attribution">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> WebGL · 关键帧动画<br/>
			模型：<a href="https://artstation.com/artwork/1AGwX" target="_blank" rel="noopener">Littlest Tokyo</a> / 
			<a href="https://artstation.com/glenatron" target="_blank" rel="noopener">Glen Fox</a>，CC BY 4.0。
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "./assets/build/three.module.js",
					"three/addons/": "./assets/examples/jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import Stats from 'three/addons/libs/stats.module.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Sky } from 'three/addons/objects/Sky.js';

			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { DRACOLoader, DRACO_GLTF_CONFIG } from 'three/addons/loaders/DRACOLoader.js';

			let mixer;

			const timer = new THREE.Timer();
			timer.connect( document );
			const container = document.getElementById( 'container' );

			const stats = new Stats();
			container.appendChild( stats.dom );

			const renderer = new THREE.WebGLRenderer( { antialias: true } );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			container.appendChild( renderer.domElement );
			renderer.domElement.setAttribute('data-od-id','interactive-canvas');
			renderer.domElement.setAttribute('aria-label','Littlest Tokyo 三维动画，拖动旋转，滚轮缩放');

			const scene = new THREE.Scene();

			// Sky

			const sky = new Sky();
			sky.scale.setScalar( 10000 );
			scene.add( sky );

			const uniforms = sky.material.uniforms;
			uniforms[ 'turbidity' ].value = 0;
			uniforms[ 'rayleigh' ].value = 3;
			uniforms[ 'mieDirectionalG' ].value = 0.7;
			uniforms[ 'cloudElevation' ].value = 1;
			uniforms[ 'sunPosition' ].value.set( - 0.8, 0.19, 0.56 ); // elevation: 11, azimuth: -55

			const pmremGenerator = new THREE.PMREMGenerator( renderer );
			const environment = pmremGenerator.fromScene( sky ).texture;
			scene.environment = environment;

			const camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 100 );
			camera.position.set( 5, 2, 8 );

			const controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			controls.target.set( 0, 0.7, 0 );
			controls.update();

			const dracoLoader = new DRACOLoader();
			dracoLoader.setDecoderPath( DRACO_GLTF_CONFIG );

			const loader = new GLTFLoader();
			loader.setDRACOLoader( dracoLoader );
			loader.load( './assets/examples/models/gltf/LittlestTokyo.glb', function ( gltf ) {

				const model = gltf.scene;
				model.position.set( 1, 1, 0 );
				model.scale.set( 0.01, 0.01, 0.01 );
				scene.add( model );

				mixer = new THREE.AnimationMixer( model );
				mixer.clipAction( gltf.animations[ 0 ] ).play();

				renderer.setAnimationLoop( animate );

			}, undefined, function ( e ) {

				console.error( e );

			} );

			window.onresize = function () {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			};

			function animate() {

				timer.update();

				const delta = timer.getDelta();

				mixer.update( delta );

				controls.update();

				stats.update();

				renderer.render( scene, camera );

			}


		</script>

	</body>

</html>
